<html lang="zh-CN">
<head>

  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./journal.css">
  <link rel="stylesheet" href="./v11.css">
  <link rel="stylesheet" href="./timeline.css">
  <link rel="stylesheet" href="./compact.css">
  <link rel="stylesheet" href="./fridge.css">
  <link rel="stylesheet" href="./summary-ui.css">
  <link rel="stylesheet" href="./settings-ui.css">
  <link rel="stylesheet" href="./soft-ui.css">
  <link rel="stylesheet" href="./strawberry-ui.css" id="strawberry-identity-style">
  <link rel="stylesheet" href="./timeline-story.css">
  <link rel="stylesheet" href="./meal-density.css">
  <link rel="stylesheet" href="./macaron-palette.css" id="macaron-palette-style">
  <link rel="stylesheet" href="./month-calendar.css">
  <link rel="stylesheet" href="./day-records.css">
  <link rel="stylesheet" href="./share-editor.css">
  <link rel="stylesheet" href="./notebook-system.css">
  <link rel="stylesheet" href="./notebook-pages.css">
  <link rel="stylesheet" href="./notebook-records.css">
  <link rel="stylesheet" href="./inventory-shortcuts.css">
  <link rel="stylesheet" href="./meal-shortcuts.css">
  <link rel="stylesheet" href="./activity-shortcuts.css">
  <link rel="stylesheet" href="./sticker-picker.css">
  <title>机智定食 · 私人生活手账</title>
</head>
<body>
  <div class="app-shell">
    <header class="brand-header" data-chapter="day"><div class="notebook-heading notebook-heading-day" data-theme="day">
    <span class="notebook-cover-tape" aria-hidden="true"></span>
    <div class="notebook-brand-copy">
      <span class="notebook-edition cover-edition">PRIVATE FOOD JOURNAL</span>
      <a class="brand" href="#calendar" aria-label="机智定食首页"><span>机智定食<small>把日常，收得甜甜一点 ♡</small></span></a>
    </div>
    <div class="notebook-cover-art" aria-hidden="true">
      <span class="notebook-art-paper"></span>
      <img class="notebook-art-primary" src="./assets/milk-carton.svg" width="78" height="78" alt="">
      <img class="notebook-art-secondary" src="./assets/share-art/strawberry-stamp.svg" width="45" height="45" alt="">
      <span class="notebook-art-spark">✧</span>
    </div>
    <span class="notebook-cover-label cover-label" aria-hidden="true">今日小餐桌 ♡</span>
  </div></header>
    <div id="data-notice" class="notice" hidden></div>
    <main id="main"></main>
    <nav class="bottom-nav" aria-label="主要页面">
      <button data-page="calendar"><svg viewBox="0 0 36 32" aria-hidden="true"><path d="M5 7c5-2 9-1 13 1 4-2 8-3 13-1v21c-5-2-9-1-13 1-4-2-8-3-13-1zM18 8v21M9 12l5 1M9 17l5 1M22 13l5-1M22 18l5-1"/><path d="M12 3v8" class="nav-ribbon"/></svg><span>餐食日历</span></button>
      <button data-page="inventory"><svg viewBox="0 0 36 32" aria-hidden="true"><path d="M5 13h26l-3 15H8zM11 13l4-8M25 13l-4-8M13 18l1 6M22 18l-1 6M7 13h22"/><path d="M17 17c-2-3-6 0-3 3l3 3 3-3c3-3-1-6-3-3z" class="nav-ribbon"/></svg><span>食材库存</span></button>
      <button data-page="summary"><svg viewBox="0 0 36 32" aria-hidden="true"><path d="M7 5h22v23H7zM12 11h12M12 16h9M12 21h7"/><path d="M24 3v8l-3-2-3 2V3" class="nav-ribbon"/></svg><span>生活汇总</span></button>
      <button data-page="settings"><svg viewBox="0 0 36 32" aria-hidden="true"><path d="M8 7h19v21H8zM6 12h4M6 18h4M6 24h4M13 3v9l4-2 4 2V3z"/><path d="M18 18c-2-3-6 0-3 3l3 3 3-3c3-3-1-6-3-3z" class="nav-ribbon"/></svg><span>我的设置</span></button>
    </nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-content" id="sheet-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <noscript>这本手账需要开启 JavaScript 才能使用。数据只保存在你的设备中。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
